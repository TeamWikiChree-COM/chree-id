name: Deploy to server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先環境（test または prod）'
        type: choice
        options:
          - test
          - prod
        default: 'test'
      base_commit:
        description: '差分の基準コミット（例: HEAD~3, コミットSHA, タグ名。空欄なら前回デプロイ時からの差分）'
        type: string
        default: ''
        required: false
      dry_run:
        description: 'ドライラン（実際の転送は行わず対象ファイルを確認）'
        type: boolean
        default: false
      full:
        description: '全件アップロード（前回の差分ではなく全追跡ファイルを転送）'
        type: boolean
        default: false
      delete:
        description: 'Gitから削除されたファイルをサーバ側からも削除'
        type: boolean
        default: false

  # push時の自動デプロイは Test ワークフローの完了を待つ（mainはprod、devはtestへ自動振り分け）
  # Test が失敗した push ではデプロイしない
  workflow_run:
    workflows: [ Test ]
    types: [ completed ]
    branches: [ main, dev ]

jobs:
  deploy:
    name: Deploy (${{ inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod') || 'test' }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # ビルド成果物を push しなくなったので読み取りだけでよい
    environment: ${{ inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod') || 'test' }}
    env:
      DEPLOY_ENV: ${{ inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'prod') || 'test' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # 差分計算・コミット履歴確認のため全履歴を取得

      # Ubuntuランナー内蔵のPython3を使用（セットアップ時間を削減）
      # FTPSはPython標準のftplibで動くためインストール不要。SFTP時のみインストール
      - name: Install SFTP dependency (if sftp)
        env:
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
        run: |
          if [ "$FTP_PROTOCOL" = "sftp" ]; then
            pip install --no-cache-dir paramiko
          fi

      - name: Restore deploy state
        uses: actions/cache/restore@v4
        with:
          path: .deploy-state
          key: deploy-state-${{ env.DEPLOY_ENV }}-${{ github.sha }}
          restore-keys: |
            deploy-state-${{ env.DEPLOY_ENV }}-

      - name: Set base commit if specified
        if: inputs.base_commit != ''
        run: |
          echo "基準コミットを手動設定します: ${{ inputs.base_commit }}"
          python tools/deploy.py --set-state "${{ inputs.base_commit }}"

      - name: Setup deploy environment config
        env:
          TARGET_ENV: ${{ env.DEPLOY_ENV }}
          # 共通または Environment Secrets
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          # リポジトリSecretで環境別に分けている場合のフォールバック
          TEST_FTP_DIR: ${{ secrets.TEST_FTP_DIR }}
          PROD_FTP_DIR: ${{ secrets.PROD_FTP_DIR }}
          TEST_FTP_HOST: ${{ secrets.TEST_FTP_HOST }}
          PROD_FTP_HOST: ${{ secrets.PROD_FTP_HOST }}
        run: |
          echo "デプロイ環境: $TARGET_ENV"
          echo "プロトコル: $FTP_PROTOCOL (ポート $FTP_PORT)"
          
          # ホスト名の判定（環境別Secretがあれば優先）
          FINAL_HOST="$FTP_HOST"
          if [ "$TARGET_ENV" = "test" ] && [ -n "$TEST_FTP_HOST" ]; then
            FINAL_HOST="$TEST_FTP_HOST"
          elif [ "$TARGET_ENV" = "prod" ] && [ -n "$PROD_FTP_HOST" ]; then
            FINAL_HOST="$PROD_FTP_HOST"
          fi

          # 転送先ディレクトリの判定
          FINAL_DIR="$FTP_DIR"
          if [ "$TARGET_ENV" = "test" ]; then
            # TEST_FTP_DIR が未指定なら自動的に chreeid/test となるよう /test を付加
            FINAL_DIR="${TEST_FTP_DIR:-${FTP_DIR%/}/test}"
          elif [ "$TARGET_ENV" = "prod" ] && [ -n "$PROD_FTP_DIR" ]; then
            FINAL_DIR="$PROD_FTP_DIR"
          fi

          # FTPS/FTPの場合、万が一 /virtual/<user>/public_html が指定されていても /public_html に自動補正
          if [ "$FTP_PROTOCOL" = "ftps" ] || [ "$FTP_PROTOCOL" = "ftp" ]; then
            FINAL_DIR="$(echo "$FINAL_DIR" | sed -E 's|^/virtual/[^/]+/public_html|/public_html|')"
          fi

          cat << EOF > tools/.deploy-env
          FTP_PROTOCOL=$FTP_PROTOCOL
          FTP_HOST=$FINAL_HOST
          FTP_PORT=$FTP_PORT
          FTP_USER=$FTP_USER
          FTP_PASS=$FTP_PASS
          FTP_DIR=$FINAL_DIR
          EOF

      # ビルド成果物はリポジトリに置かず、ここで作ったものを deploy.py が直接送る
      # (.deploy-include 参照)。変更の有無で分岐しないのは、送らなかった回に
      # サーバ側が取り残されると、次に誰かが気付くまで古いままになるため。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Run deploy script
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.full }}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          if [ "${{ inputs.delete }}" = "true" ]; then
            ARGS="$ARGS --delete"
          fi
          python tools/deploy.py $ARGS

      - name: Save deploy state
        if: success() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: .deploy-state
          key: deploy-state-${{ env.DEPLOY_ENV }}-${{ github.sha }}
